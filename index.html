<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>我的國家圖鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: passport-ledger header with a big stamp count, full-width map, then search + visited list in two columns */
:root{
  --bg:#eef1f4; --surface:#ffffff; --fg:#1b2430; --muted:#5d6876; --line:#d5dbe2;
  --ocean:#dfe7ee; --land:#c9d1da; --land-hover:#aeb9c5; --border:#ffffff;
  --s0:#8e2f2a;--s1:#b0463a;--s2:#cb6a4c;--s3:#de9469;--s4:#e9bb8f;--s5:#e3d6ae;--s6:#b6d1c1;--s7:#7db3a4;--s8:#3f8e85;--s9:#1f6a69;--ink:#2a3f8f; --ink-hover:#3c55b5; --ink-soft:#e3e8f7; --danger:#b3261e;
  --display:"Space Grotesk","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161c; --surface:#1a2028; --fg:#e7ebf0; --muted:#97a2af; --line:#2b333e;
  --ocean:#161c24; --land:#323b47; --land-hover:#465261; --border:#161c24;
  --s0:#b9473f;--s1:#cc5d4c;--s2:#d97c5c;--s3:#e29c74;--s4:#e7bf96;--s5:#d9d2ae;--s6:#a9cdbc;--s7:#7cc0ae;--s8:#4fa79b;--s9:#3c8f8a;--ink:#8fa6ff; --ink-hover:#b0c0ff; --ink-soft:#232c45; --danger:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --surface:#1a2028; --fg:#e7ebf0; --muted:#97a2af; --line:#2b333e;
  --ocean:#161c24; --land:#323b47; --land-hover:#465261; --border:#161c24;
  --s0:#b9473f;--s1:#cc5d4c;--s2:#d97c5c;--s3:#e29c74;--s4:#e7bf96;--s5:#d9d2ae;--s6:#a9cdbc;--s7:#7cc0ae;--s8:#4fa79b;--s9:#3c8f8a;--ink:#8fa6ff; --ink-hover:#b0c0ff; --ink-soft:#232c45; --danger:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{font-family:var(--display);font-size:clamp(22px,4vw,30px);margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:14px}
.stat{display:flex;align-items:baseline;gap:8px}
.stat b{font-family:var(--display);font-size:clamp(40px,8vw,56px);line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:14px}
.mapbox{position:relative;background:var(--ocean);border:1px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none}
svg{display:block;width:100%;height:auto;aspect-ratio:960/500;cursor:grab;user-select:none;-webkit-user-select:none}
svg.dragging{cursor:grabbing}
.sphere{fill:var(--ocean)}
.c{fill:var(--land);stroke:var(--border);stroke-width:.5px;vector-effect:non-scaling-stroke;transition:fill .15s}
.c:hover,.dot:hover{fill:var(--land-hover)}
.c.on,.dot.on{fill:var(--ink)}
.c.on:hover,.dot.on:hover{fill:var(--ink-hover)}
.c.flash{animation:flash .9s ease-out}
@keyframes flash{0%{stroke:var(--ink);stroke-width:3px}100%{stroke-width:.5px}}
.dot{fill:var(--land);stroke:var(--fg);stroke-opacity:.35;vector-effect:non-scaling-stroke;stroke-width:.6px;cursor:pointer}
.tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--fg);border:1px solid var(--line);
  padding:3px 10px;border-radius:6px;font-size:13px;white-space:nowrap;box-shadow:0 2px 8px rgb(0 0 0/.12);transform:translate(-50%,-130%)}
.tip small{color:var(--muted);margin-left:6px}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px}
.zoom button,.btn{font:inherit;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.zoom button{width:34px;height:34px;font-size:18px;line-height:1}
.zoom button:hover,.btn:hover{border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hint{color:var(--muted);font-size:13px;margin:0;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.sync{display:inline-flex;align-items:center;gap:6px;color:var(--fg)}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="ok"]::before{background:#2e9d5b}
.sync[data-s="warn"]::before{background:#d08a1c}
.panels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px}
@media (max-width:720px){.panels{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{font-family:var(--display);font-size:16px;margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
input[type=search]{font:inherit;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.results{list-style:none;margin:0;padding:0;max-height:240px;overflow:auto;display:flex;flex-direction:column}
.results button{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--ink-soft)}
.results .en{color:var(--muted);font-size:13px}
.results .mark{color:var(--ink);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--ink-soft);color:var(--fg);border-radius:999px;padding:2px 4px 2px 12px;font-size:14px}
.chip button{all:unset;cursor:pointer;padding:0 6px;border-radius:999px;color:var(--muted);font-size:15px}
.chip button:hover{color:var(--danger)}
.chip .go{color:var(--fg);padding:0}
.empty{color:var(--muted);font-size:14px;margin:0}
.btn{padding:4px 10px;font-size:13px;font-weight:400}
.btn.danger{color:var(--danger)}
.confirm{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:400;color:var(--muted)}
.note{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.note-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.note-head h2 span.en{font-family:var(--body);font-weight:400;color:var(--muted);font-size:13px;margin-left:8px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;width:100%}
.field textarea.short{min-height:64px}
.ally{display:inline-block;margin-left:6px;padding:0 8px;border-radius:999px;background:var(--ink-soft);color:var(--ink);font-size:12px;font-weight:700}
.field textarea{min-height:110px;resize:vertical;line-height:1.6}
.btn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.has-note .go::after{content:"✎";margin-left:4px;color:var(--ink);font-size:12px}
.saved{font-size:12px;color:var(--muted)}
.loading{position:absolute;inset:0;display:grid;place-items:center;margin:0;color:var(--muted);font-size:14px}
.io{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
#ioText{font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:90px}
.mode-fh .c.b0,.mode-fh .dot.b0,.lg i.b0{fill:var(--s0);background:var(--s0)}
.mode-fh .c.b1,.mode-fh .dot.b1,.lg i.b1{fill:var(--s1);background:var(--s1)}
.mode-fh .c.b2,.mode-fh .dot.b2,.lg i.b2{fill:var(--s2);background:var(--s2)}
.mode-fh .c.b3,.mode-fh .dot.b3,.lg i.b3{fill:var(--s3);background:var(--s3)}
.mode-fh .c.b4,.mode-fh .dot.b4,.lg i.b4{fill:var(--s4);background:var(--s4)}
.mode-fh .c.b5,.mode-fh .dot.b5,.lg i.b5{fill:var(--s5);background:var(--s5)}
.mode-fh .c.b6,.mode-fh .dot.b6,.lg i.b6{fill:var(--s6);background:var(--s6)}
.mode-fh .c.b7,.mode-fh .dot.b7,.lg i.b7{fill:var(--s7);background:var(--s7)}
.mode-fh .c.b8,.mode-fh .dot.b8,.lg i.b8{fill:var(--s8);background:var(--s8)}
.mode-fh .c.b9,.mode-fh .dot.b9,.lg i.b9{fill:var(--s9);background:var(--s9)}
.mode-fh .c.on,.mode-fh .dot.on{stroke:var(--fg);stroke-width:1.6px;stroke-opacity:1}
.mode-fh .c:hover,.mode-fh .dot:hover{filter:brightness(.9)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{font:inherit;font-size:14px;border:0;background:transparent;color:var(--muted);padding:5px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.legend{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.lg{display:flex;align-items:center;gap:0}
.lg i{display:block;width:26px;height:10px}
.lg i:first-child{border-radius:3px 0 0 3px}.lg i:last-child{border-radius:0 3px 3px 0}
.lg-l{display:flex;justify-content:space-between;width:260px;max-width:100%;font-variant-numeric:tabular-nums}
.fh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:10px 12px;border-radius:8px;background:var(--bg)}
.fh b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.fh .st{font-weight:700;font-size:13px;padding:0 8px;border-radius:999px;color:#fff}
.fh small{color:var(--muted);font-size:12px}
.avg{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.c{transition:none}.c.flash{animation:none}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>我的國家圖鑑</h1>
      <p class="sub">點國家標記認識過，下方可以寫備註；同一個國家再點一次取消。小國家可以放大，或用下方搜尋。</p>
    </div>
    <div class="stat"><b id="count">0</b><span>個國家／地區<br><span id="pct">0%</span> 的世界</span><br><span class="avg" id="avg"></span></div>
  </header>

  <div class="toolbar">
    <div class="seg" role="group" aria-label="地圖顯示">
      <button id="mMine" aria-pressed="true">我的標記</button>
      <button id="mFh" aria-pressed="false">民主分數</button>
    </div>
    <div class="legend" id="legend" hidden>
      <div class="lg" aria-hidden="true"><i class="b0"></i><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i><i class="b5"></i><i class="b6"></i><i class="b7"></i><i class="b8"></i><i class="b9"></i></div>
      <div class="lg-l"><span>0 不自由</span><span>部分自由</span><span>自由 100</span></div>
    </div>
  </div>
  <div class="mapbox" id="mapbox">
    <svg id="map" viewBox="0 0 960 500" role="img" aria-label="可點選的世界地圖">
      <path class="sphere" id="sphere"></path>
      <g id="countries"></g>
      <g id="dots"></g>
    </svg>
    <div class="tip" id="tip" hidden></div>
    <div class="zoom">
      <button id="zin" aria-label="放大">+</button>
      <button id="zout" aria-label="縮小">−</button>
      <button id="zreset" aria-label="重設視角" style="font-size:14px">⟲</button>
    </div>
  </div>
  <p class="hint"><span class="sync" id="sync" data-s="wait">連線中…</span> 滾輪或雙指縮放，拖曳移動。<span id="fhSrc" hidden>民主分數：自由之家《Freedom in the World 2026》，評估 2025 年狀況。框線＝你認識過的國家。</span></p>

  <div class="panels">
    <section class="panel">
      <h2>搜尋國家</h2>
      <input type="search" id="q" placeholder="輸入中文或英文，例如：貝里斯、Belize" autocomplete="off">
      <ul class="results" id="results"></ul>
    </section>
    <section class="panel">
      <h2><span>認識過的國家</span><span id="clearArea"></span></h2>
      <div class="chips" id="chips"></div>
      <div class="io" id="io">
        <button class="btn" id="exportBtn">匯出資料</button>
        <button class="btn" id="importBtn">匯入資料</button>
        <span class="saved" id="ioMsg"></span>
      </div>
      <div class="field" id="ioArea" hidden>
        <textarea id="ioText" class="short" aria-label="資料內容" spellcheck="false"></textarea>
        <div class="io"><button class="btn" id="ioGo">匯入</button><button class="btn" id="ioCancel">取消</button></div>
      </div>
    </section>
  </div>

  <section class="panel note" id="notePanel" aria-live="polite">
    <p class="empty" id="noteEmpty">點地圖上的國家，或點上方「認識過的國家」裡的名字，就能在這裡寫備註。</p>
    <div id="noteBody" hidden>
      <div class="note-head">
        <h2 id="noteTitle"></h2>
        <button class="btn" id="noteToggle"></button>
      </div>
      <div class="fh" id="fhBox" style="margin-top:10px"></div>
      <div class="note" style="margin-top:10px">
        <label class="field">什麼時候認識的
          <input id="noteWhen" type="text" placeholder="例如：2026/11/13 桌曆" maxlength="60" autocomplete="off">
        </label>
        <label class="field"><span>與台灣的關係 <span class="ally" id="allyBadge" hidden>邦交國</span></span>
          <textarea id="noteRel" class="short" placeholder="例如：1989 年建交、每年在國際組織替台灣發聲、台灣進口它的蝦子" maxlength="2000"></textarea>
        </label>
        <label class="field">備註
          <textarea id="noteText" placeholder="首都、語言、歷史、有趣的小知識……" maxlength="4000"></textarea>
        </label>
        <span class="saved" id="noteSaved">打字會自動儲存</span>
      </div>
    </div>
  </section>
</div>

/* ---- view / zoom ---- */
const FULL={x:0,y:0,w:960,h:500};
let view={...FULL};
function apply(){
  view.w=Math.min(Math.max(view.w,960/40),960); view.h=view.w*500/960;
  view.x=Math.min(Math.max(view.x,-view.w*0.25),960-view.w*0.75);
  view.y=Math.min(Math.max(view.y,-view.h*0.25),500-view.h*0.75);
  svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);
  const r=2.2*Math.pow(view.w/960,0.85); for(const d of gD.children) d.setAttribute('r',r);
}
function zoomAt(f,cx,cy){ // cx,cy in svg units
  const nw=Math.min(Math.max(view.w*f,960/40),960), k=nw/view.w;
  view.x=cx-(cx-view.x)*k; view.y=cy-(cy-view.y)*k; view.w=nw; apply();
}
function toSvg(clientX,clientY){const r=svg.getBoundingClientRect();return [view.x+(clientX-r.left)/r.width*view.w, view.y+(clientY-r.top)/r.height*view.h];}
function focus(k){
  const c=byKey.get(k); if(!c) return;
  const [x0,y0,x1,y1]=c.b, cx=(x0+x1)/2, cy=(y0+y1)/2;
  let w=Math.max((x1-x0)*2.2,(y1-y0)*2.2*960/500,960/40); w=Math.min(w,960);
  view={x:cx-w/2,y:cy-w*500/960/2,w,h:w*500/960}; apply();
  for(const el of els.get(k)) {el.classList.remove('flash'); void el.getBBox(); el.classList.add('flash');}
}
document.getElementById('zin').onclick=()=>zoomAt(0.6,view.x+view.w/2,view.y+view.h/2);

document.getElementById('zreset').onclick=()=>{view={...FULL};apply();};
svg.addEventListener('wheel',e=>{e.preventDefault();const [x,y]=toSvg(e.clientX,e.clientY);zoomAt(Math.exp(e.deltaY*0.0015),x,y);},{passive:false});

const ptrs=new Map(); let moved=0, pinch0=null;
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),w:view.w};}});
svg.addEventListener('pointermove',e=>{
  showTip(e);
  if(!ptrs.has(e.pointerId)) return;
  const prev=ptrs.get(e.pointerId), cur={x:e.clientX,y:e.clientY}; ptrs.set(e.pointerId,cur);
  const r=svg.getBoundingClientRect();
  if(ptrs.size===1){const dx=cur.x-prev.x,dy=cur.y-prev.y;moved+=Math.abs(dx)+Math.abs(dy);
    if(moved>4){svg.classList.add('dragging');view.x-=dx/r.width*view.w;view.y-=dy/r.height*view.h;apply();}}
  else if(ptrs.size===2&&pinch0){moved=99;const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);
    const [cx,cy]=toSvg((a.x+b.x)/2,(a.y+b.y)/2);zoomAt((pinch0.w*pinch0.d/d)/view.w,cx,cy);}
});
function up(e){
  if(ptrs.size===1&&moved<=4){const t=document.elementFromPoint(e.clientX,e.clientY);const k=t&&t.dataset&&t.dataset.k;if(k){ if(!CAN_EDIT){ select(k); } else if(k!==sel){ if(!visited.has(k)) toggle(k); select(k); } else toggle(k); showTip(e);}}
  ptrs.delete(e.pointerId); if(ptrs.size<2) pinch0=null; if(!ptrs.size) svg.classList.remove('dragging');
}
svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);pinch0=null;});
svg.addEventListener('pointerleave',()=>{tip.hidden=true;});

function showTip(e){
  if(e.pointerType==='touch'&&!ptrs.size){tip.hidden=true;return;}
  const t=e.target, k=t.dataset&&t.dataset.k;
  if(!k){tip.hidden=true;return;}
  const c=byKey.get(k), r=box.getBoundingClientRect();
  tip.innerHTML=''; tip.append(c.n); const s=document.createElement('small'); const f=FH[k]; s.textContent=(f&&box.classList.contains('mode-fh')?'民主 '+f[0]+' · ':'')+(visited.has(k)?'✓ 認識過':'點一下標記')+(notes[k]?' ✎':''); tip.append(s);
  tip.style.left=(e.clientX-r.left)+'px'; tip.style.top=(e.clientY-r.top)+'px'; tip.hidden=false;

const q=document.getElementById('q'), results=document.getElementById('results');
function renderResults(){
  const s=q.value.trim().toLowerCase(); results.innerHTML='';
  if(!s){const li=document.createElement('li');li.className='empty';li.textContent='輸入名稱來找國家。點結果會標記並移到那裡。';results.appendChild(li);return;}
  const hits=DATA.c.filter(c=>c.n.toLowerCase().includes(s)||c.e.toLowerCase().includes(s)).slice(0,40);
  if(!hits.length){const li=document.createElement('li');li.className='empty';li.textContent='找不到符合的國家，試試其他寫法。';results.appendChild(li);return;}
  for(const c of hits){
    const li=document.createElement('li'),b=document.createElement('button');
    const l=document.createElement('span'); l.textContent=c.n+' '; const en=document.createElement('span');en.className='en';en.textContent=c.e;l.append(en);
    const m=document.createElement('span'); m.className='mark'; m.textContent=visited.has(c.k)?'✓ 認識過':'';
    b.append(l,m); b.onclick=()=>{if(CAN_EDIT&&!visited.has(c.k))toggle(c.k);focus(c.k);select(c.k);};
    li.appendChild(b); results.appendChild(li);
  }
}

const chips=document.getElementById('chips'), clearArea=document.getElementById('clearArea');
function renderSide(){
  const n=visited.size;

  document.getElementById('pct').textContent=(n/total*100).toFixed(1)+'%';
  const sc=[...visited].map(k=>FH[k]).filter(Boolean);
  document.getElementById('avg').textContent=sc.length?'認識的國家平均民主分數 '+Math.round(sc.reduce((a,f)=>a+f[0],0)/sc.length):'';
  chips.innerHTML='';
  if(!n){const p=document.createElement('p');p.className='empty';p.textContent='還沒有標記。可以從今天桌曆上的國家開始，例如在地圖上找到中美洲的貝里斯。';chips.appendChild(p);}
  const list=[...visited].map(k=>byKey.get(k)).filter(Boolean).sort((a,b)=>a.n.localeCompare(b.n,'zh-Hant-TW-u-co-stroke'));
  for(const c of list){
    const sp=document.createElement('span');sp.className='chip';
    const go=document.createElement('button');go.className='go';go.textContent=c.n;go.title='在地圖上顯示並寫備註';go.onclick=()=>{focus(c.k);select(c.k);};
    if(notes[c.k]) sp.classList.add('has-note');
    const x=document.createElement('button');x.textContent='×';x.setAttribute('aria-label','移除'+c.n);x.onclick=()=>toggle(c.k);
    if(CAN_EDIT) sp.append(go,x); else sp.append(go);chips.appendChild(sp);
  }
  renderClear(false); renderResults();
}
function renderClear(asking){
  clearArea.innerHTML=''; if(!visited.size||!CAN_EDIT) return;
  if(!asking){const b=document.createElement('button');b.className='btn';b.textContent='全部清除';b.onclick=()=>renderClear(true);clearArea.appendChild(b);return;}
  const w=document.createElement('span');w.className='confirm';w.append('確定清除？');
  const y=document.createElement('button');y.className='btn danger';y.textContent='清除';y.onclick=()=>{const ks=[...visited];visited.clear();ks.forEach(paint);save();renderSide();queueCloud();};
  const n=document.createElement('button');n.className='btn';n.textContent='取消';n.onclick=()=>renderClear(false);
  w.append(y,n);clearArea.appendChild(w);
}

  const sel=()=>{ioText.focus();ioText.select();};
  try{ navigator.clipboard.writeText(txt).then(()=>{ioMsg.textContent='已複製，可以貼到另一個版本的「匯入資料」';},()=>{sel();ioMsg.textContent='請手動複製下方文字';}); }catch(e){ sel(); ioMsg.textContent='請手動複製下方文字'; }
};

  let d; try{ d=JSON.parse(ioText.value); }catch(e){ ioMsg.textContent='內容格式不對，請貼上完整的匯出資料'; return; }
  if(!d||!Array.isArray(d.list)){ ioMsg.textContent='找不到國家清單，請確認是從「匯出資料」複製的'; return; }
  const before=visited.size;
  d.list.filter(k=>byKey.has(k)).forEach(k=>{visited.add(k);paint(k);});
  if(d.notes&&typeof d.notes==='object') for(const [k,n] of Object.entries(d.notes)) if(byKey.has(k)&&n) notes[k]={d:String(n.d||''),r:String(n.r||''),t:String(n.t||'')};

};

function rowsForSheet(){
  const ks=new Set([...visited,...Object.keys(notes)]);
  return [...ks].filter(k=>byKey.has(k)).sort((a,b)=>byKey.get(a).n.localeCompare(byKey.get(b).n,'zh-Hant-TW-u-co-stroke'))

function queueCloud(){ if(!ref) return; dirty=true; clearTimeout(timer); timer=setTimeout(flush,1200); setSync('wait','儲存中…'); }
async function flush(){
  if(!ref||writing) return; writing=true;
  while(dirty){ dirty=false;
    try{ const res=await post({key:editKey, rows:rowsForSheet()});
      if(res.ok){ setSync('ok','已存到 Google 試算表'); if(sel) noteSaved.textContent='已儲存'; }
      else { setSync('warn', res.error==='bad_key'?'編輯密碼不對，這次修改沒有存到試算表':'試算表沒有存成功：'+(res.error||'')); break; }
    }catch(e){ setSync('warn','連不上 Google，修改先記在這台裝置'); break; }
  }
  writing=false;
}
function applyRemote(data){
  const list=Array.isArray(data.list)?data.list:[];
  if(data.notes&&typeof data.notes==='object') notes={...data.notes};
  const next=new Set(list.filter(k=>byKey.has(k)));
  const all=new Set([...visited,...next]); visited=next;
  all.forEach(paint); save(); renderSide();
  if(sel){ renderNoteHead(); if(![noteWhen,noteRel,noteText].includes(document.activeElement)) renderNoteFields(); }
}

/* 編輯模式：沒有密碼的人只能看 */
const hintEl=syncEl.parentElement;
const editBtn=document.createElement('button'); editBtn.className='btn'; editBtn.id='editBtn';
const keyBox=document.createElement('span'); keyBox.className='io'; keyBox.hidden=true;
const keyIn=document.createElement('input'); keyIn.type='password'; keyIn.id='editKey'; keyIn.placeholder='編輯密碼'; keyIn.autocomplete='current-password';
keyIn.style.cssText='font:inherit;font-size:13px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:9em';
const keyGo=document.createElement('button'); keyGo.className='btn'; keyGo.textContent='確認';
keyBox.append(keyIn,keyGo); hintEl.append(editBtn,keyBox);
function renderEditBtn(){ editBtn.textContent=editKey?'登出編輯':'我要編輯'; }
editBtn.onclick=()=>{
  if(editKey){ editKey=''; try{localStorage.removeItem(KEYNAME)}catch(e){} setEditable(false); renderEditBtn(); setSync('ok','唯讀模式'); return; }
  keyBox.hidden=!keyBox.hidden; if(!keyBox.hidden) keyIn.focus();
};
async function tryKey(){
  const k=keyIn.value; if(!k) return; keyGo.disabled=true; setSync('wait','確認密碼中…');
  try{ const res=await post({key:k, check:true});
    if(res.ok){ editKey=k; try{localStorage.setItem(KEYNAME,k)}catch(e){} keyBox.hidden=true; keyIn.value=''; setEditable(true); renderEditBtn(); setSync('ok','編輯模式，修改會存到 Google 試算表'); }
    else setSync('warn','密碼不對，請再試一次');
  }catch(e){ setSync('warn','連不上 Google，請稍後再試'); }
  keyGo.disabled=false;
}
keyGo.onclick=tryKey; keyIn.addEventListener('keydown',e=>{ if(e.key==='Enter') tryKey(); });

(async()=>{
  if(!SCRIPT_URL){ editBtn.hidden=true; setSync('warn','還沒接上 Google 試算表，標記只存在這台裝置'); return; }
  ref=true; renderEditBtn(); setEditable(!!editKey);
  setSync('wait','讀取 Google 試算表…');
  try{
    const r=await fetch(SCRIPT_URL); const data=await r.json();
    applyRemote(data);
    setSync('ok', editKey?'編輯模式，修改會存到 Google 試算表':'唯讀模式');
  }catch(e){ setSync('warn','暫時讀不到 Google 試算表，先顯示這台裝置的紀錄'); }
})();
